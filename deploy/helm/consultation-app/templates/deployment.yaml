apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "boussole.fullname" . }}
  labels:
    {{- include "boussole.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "boussole.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "boussole.selectorLabels" . | nindent 8 }}
    spec:
      # IMPORTANT : le conteneur tourne en non-root (uid/gid 1000, voir le
      # Dockerfile). Sans fsGroup, un PersistentVolume fraîchement
      # provisionné est généralement monté avec les droits root:root, ce
      # qui empêcherait l'application d'écrire sa base SQLite dans le
      # volume persistant monté sur /app/data au premier démarrage.
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "boussole.fullname" . }}-data
      {{- end }}
