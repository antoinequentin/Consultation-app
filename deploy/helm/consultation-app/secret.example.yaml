# Exemple de Secret à créer manuellement AVANT le déploiement du chart Helm
# (voir TUTORIEL_DEPLOIEMENT_SSPCLOUD.md). Ne committez jamais ce fichier
# avec de vraies valeurs : utilisez-le comme modèle local, ou créez le
# secret directement en ligne de commande (méthode recommandée) :
#
#   kubectl create secret generic boussole-secrets \
#     --from-literal=SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))")
#
# Si vous utilisez PostgreSQL plutôt que SQLite, ajoutez aussi
# DATABASE_URL au secret (cf. tutoriel, section "Option : PostgreSQL").

apiVersion: v1
kind: Secret
metadata:
  name: boussole-secrets
type: Opaque
stringData:
  SECRET_KEY: "changeme-generate-a-real-secret-key"
  # DATABASE_URL: "postgresql+psycopg2://user:password@postgresql-xxxx:5432/dbname"
