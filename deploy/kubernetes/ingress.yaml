# Remplacez le host par votre propre sous-domaine *.lab.sspcloud.fr.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boussole
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: consultation-bte.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boussole
                port:
                  number: 8000
