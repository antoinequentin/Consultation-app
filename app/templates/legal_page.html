{% extends "base.html" %}
{% block title %}{{ page_title }} — {{ app_name }}{% endblock %}
{% block body %}

<header class="app-header">
  <div class="app-header-inner">
    <a class="brand" href="/"><img class="brand-mark" src="/static/img/logo.png" alt=""> Boussole</a>
  </div>
</header>

<main class="container-narrow" style="padding: var(--sp-6) var(--sp-4);">
  <h1>{{ page_title }}</h1>
  {% for heading, body in sections %}
  <section style="margin-bottom: var(--sp-5);">
    <h2>{{ heading }}</h2>
    <p class="text-sm" style="white-space: pre-line;">{{ body }}</p>
  </section>
  {% endfor %}
</main>

{% endblock %}
